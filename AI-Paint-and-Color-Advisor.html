<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sherwin-Williams | AI Paint &amp; Color Advisor</title>
<style>
:root{--blue:#13408e;--blue2:#0d2f6b;--olive:#6b6f56;--ink:#26292e;--mut:#6f7480;--bg:#fff;--card:#f6f5f1;--bot:#ecebe6;--tan:#d3cabd;--line:#dedcd5;--shadow:0 18px 50px rgba(20,25,40,.30);box-sizing:border-box}
*{box-sizing:border-box}html,body{margin:0;background:#ecebe6}body{font-family:"Segoe UI",Inter,system-ui,-apple-system,Arial,sans-serif;color:var(--ink)}
.site{display:block;width:100%;height:auto}
#launcher{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:20;width:66px;height:66px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(145deg,#1a52b3,#0d2f6b);color:#fff;box-shadow:0 8px 24px rgba(13,47,107,.45);display:grid;place-items:center;transition:transform .2s}
#launcher:hover{transform:scale(1.07)}#launcher:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #13408e;animation:ring 2.2s ease-out infinite;pointer-events:none}
#launcher svg{width:32px;height:32px;position:relative}
#badge{position:absolute;top:-4px;right:-4px;background:#d6322c;color:#fff;font:700 12px/20px sans-serif;width:22px;height:22px;border-radius:50%;border:2px solid #fff;z-index:2;display:grid;place-items:center;font-size:11px;line-height:1}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.55);opacity:0}}
#nudge{position:fixed;right:22px;bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:20;width:300px;background:#fff;border-radius:4px;border-left:4px solid var(--blue);padding:14px 18px 14px 16px;box-shadow:var(--shadow);cursor:pointer;transform:translateY(18px);opacity:0;pointer-events:none;transition:.4s ease}
#nudge.show{transform:none;opacity:1;pointer-events:auto}
#nudge small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--olive);font-weight:700;margin-bottom:5px}
#nudge b{display:block;font-size:17px;font-weight:400;line-height:1.25;margin-bottom:4px}#nudge span{font-size:13px;color:var(--mut);line-height:1.45}
#nudge .x{position:absolute;top:4px;right:8px;font-size:18px;color:var(--mut);background:none;border:0;cursor:pointer}
#chat{position:fixed;right:22px;bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:30;width:396px;height:min(650px,calc(100% - 128px));background:#fff;border-radius:6px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transform:translateY(22px);opacity:0;pointer-events:none;transition:.3s ease}
#chat.open{transform:none;opacity:1;pointer-events:auto}
.hd{background:var(--blue);color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center;border-bottom:4px solid var(--tan)}
.av{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font:italic 800 15px Georgia,serif;flex:none}
.hd h1{font-size:15px;margin:0;font-weight:600}.hd p{font-size:12px;margin:2px 0 0;opacity:.9}.dot{display:inline-block;width:8px;height:8px;background:#5fe39a;border-radius:50%;margin-right:5px}
.hd button{background:rgba(255,255,255,.16);border:0;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px}.hd button:first-of-type{margin-left:auto}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#fff;scroll-behavior:smooth}
.m{max-width:88%;padding:11px 14px;border-radius:4px 14px 14px 14px;font-size:14px;line-height:1.55;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.m.b{background:var(--bot);align-self:flex-start}.m.u{background:var(--olive);color:#fff;align-self:flex-end;border-radius:14px 4px 14px 14px}
.m p{margin:0 0 7px}.m p:last-child{margin:0}.m ul{margin:4px 0 7px;padding-left:18px}.m li{margin-bottom:3px}
.typing{display:flex;gap:4px;padding:15px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:bn 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.sw{display:flex;gap:8px;overflow-x:auto;align-self:stretch;padding-bottom:4px}
.card{flex:none;width:136px;border-radius:3px;overflow:hidden;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.14)}
.card .c{height:70px}.card .t{padding:8px 10px 10px;font-size:11.5px;line-height:1.35}.card b{display:block;font-size:12.5px;font-weight:600}.card small{color:var(--mut)}
.card a{display:block;margin-top:7px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--blue);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-self:stretch}
.chips button{border:1px solid #2b2e33;color:#2b2e33;background:#fff;border-radius:2px;padding:8px 12px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;cursor:pointer;font-family:inherit}
.chips button:hover{background:#2b2e33;color:#fff}
.in{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.in input{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:3px;padding:11px 14px;font-size:14px;outline:0;font-family:inherit}.in input:focus{border-color:var(--blue)}
.in button{width:44px;border-radius:3px;border:0;background:var(--blue);color:#fff;cursor:pointer;font-size:17px}.in button:hover{background:var(--blue2)}
.ft{text-align:center;font-size:10.5px;color:var(--mut);padding:0 8px 9px}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--olive);margin:2px 0 6px}
.pw{align-self:stretch}.prods{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px}
.pr{flex:none;width:170px;background:#fff;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.16);overflow:hidden;display:flex;flex-direction:column;animation:in .3s ease}
.pr .im{height:132px;background:linear-gradient(180deg,#f6f4ef,#e3dfd6);display:grid;place-items:center}.pr .im svg{height:116px;width:auto}
.pr .t{padding:10px 11px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.pr small{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);font-weight:700}.pr b{font-size:13px;font-weight:600;line-height:1.25}
.pr p{margin:0;font-size:11.5px;color:var(--mut);line-height:1.4}.pr .bt{margin-top:auto;padding-top:9px;display:flex;gap:6px}
.pr .bt a{flex:1;text-align:center;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:8px 2px;border:1px solid #2b2e33;color:#2b2e33;cursor:pointer;border-radius:2px}.pr .bt a:hover{background:#2b2e33;color:#fff}
.pr .bt a.p{background:var(--blue);border-color:var(--blue);color:#fff}.pr .bt a.p:hover{background:var(--blue2)}
@media(max-width:520px){#chat{right:0;left:0;bottom:0;width:100%;height:100%;border-radius:0}#nudge{right:12px;width:255px}}
</style></head><body>

[/(open|hour|time|where|nearest|near me|locat|store|branch|address)/,()=>"Stores are now open from **6AM, Monday to Friday**. Tap **Find a Store** at the top of the page to see your nearest location and details. Need help deciding what to buy first?","Order samples|Top colors|Paint calculator"],
