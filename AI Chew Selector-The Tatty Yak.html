<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Chew Selector – The Tatty Yak (prototype)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐃</text></svg>">
<style>
/* ===== Brand tokens (sampled from the supplied thetattyyak.com screenshot) ===== */
:root{--ink:#111;--ink2:#333;--lav:#dbe1ff;--lav2:#f0f2ff;--yel:#f4f691;--grey:#f6f6f6;--line:#e2e2e2;--mut:#666;--bg:#fff;
--font:"Inter","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:#bdbdbd}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #5b6cff;outline-offset:2px}
/* ===== Preview stage: real-site capture as background ===== */
.stage{min-height:100dvh;display:flex;align-items:center;justify-content:center}
.vp{position:relative;overflow:hidden;background:#fff var(--site) center top/cover no-repeat}
.stage[data-view=desktop] .vp{width:100vw;height:100dvh}
.stage[data-view=mobile] .vp{width:390px;height:min(780px,calc(100dvh - 32px));border:10px solid #111;border-radius:38px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.tg{position:fixed;left:14px;bottom:14px;z-index:2147483600;display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(17,17,17,.88);border-radius:999px;padding:3px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.seg button{border:0;background:transparent;color:#fff;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px}
.seg button[aria-pressed=true]{background:#fff;color:#111}
@media(max-width:600px){.stage[data-view] .vp{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}.tg{display:none}}
/* ===== Launcher ===== */
.launch{position:absolute;right:20px;bottom:20px;z-index:5;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:10px 20px 10px 10px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35);font-weight:700;font-size:14px}
.launch:hover{background:var(--ink2)}
.launch .ic{width:36px;height:36px;border-radius:50%;background:#fff;overflow:hidden;display:block}
.launch .ic img,.hd .av img{width:100%;height:100%;object-fit:cover;display:block}
.launch[hidden],.w[hidden]{display:none}
/* ===== Widget ===== */
.w{position:absolute;right:20px;bottom:20px;z-index:6;width:392px;max-width:calc(100% - 24px);height:min(700px,calc(100% - 40px));background:var(--bg);border-radius:18px;box-shadow:0 18px 56px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden}
.stage[data-view=mobile] .w{inset:auto 0 0 0;width:auto;max-width:none;height:84%;border-radius:18px 18px 0 0}
@media(max-width:600px){.w{inset:0;width:auto;max-width:none;height:auto;border-radius:0}.launch{right:14px;bottom:14px}}
.hd{background:var(--ink);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.hd .av{width:34px;height:34px;border-radius:50%;background:#fff;overflow:hidden;flex:none}
.hd .t{flex:1;line-height:1.2}.hd b{font-size:15px;display:block}.hd small{font-size:11px;opacity:.7}
.hd button{background:transparent;border:0;color:#fff;cursor:pointer;font-size:18px;width:34px;height:34px;border-radius:8px}
.hd button:hover:not(:disabled){background:rgba(255,255,255,.18)}
.hd button:disabled{opacity:.3;cursor:default}
.prog{display:flex;gap:6px;align-items:center;padding:8px 14px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line);background:var(--bg)}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}.prog i.on{background:var(--ink)}
.log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg);overscroll-behavior:contain}
.log>*{flex:none}
.wi{width:100%;height:120px;object-fit:cover;border-radius:14px;background:var(--lav)}
.m{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.m.b{background:var(--lav2);border-top-left-radius:4px;align-self:flex-start}
.m.u{background:var(--ink);color:#fff;border-top-right-radius:4px;align-self:flex-end}
.ticks{list-style:none;margin:8px 0 0;padding:0;font-size:13px}.ticks li:before{content:"✓ ";font-weight:700}
.typ{display:flex;gap:4px;padding:13px 14px}.typ i{width:7px;height:7px;border-radius:50%;background:#8a93c9;animation:bl 1.2s infinite}.typ i:nth-child(2){animation-delay:.15s}.typ i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:14px;min-height:44px}
.opt small{display:block;color:var(--mut);font-size:12px}
.opt:hover:not(:disabled){border-color:var(--ink);background:var(--grey)}
.opt:disabled{opacity:.45;cursor:default}
.opt.pri{background:var(--ink);color:#fff;border-color:var(--ink);justify-content:center;font-weight:700;border-radius:999px}
.opt.pri:hover:not(:disabled){background:var(--ink2)}
.opt.cta{justify-content:center;font-weight:600;border-radius:999px}
.opt .e{font-size:20px}
.cards{display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:10px;background:var(--bg)}
.art{flex:0 0 84px;height:84px;border-radius:10px;background:var(--lav);overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.card h4{margin:0 0 2px;font-size:14px;line-height:1.25}.card .cat{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.best{display:inline-block;background:var(--yel);color:#222;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-bottom:4px}
.why{list-style:none;margin:6px 0;padding:0;font-size:12px;color:var(--mut);line-height:1.45}.why li:before{content:"✓ ";color:var(--ink);font-weight:700}
.pr{font-weight:700;font-size:16px}.pr s{font-weight:400;color:var(--mut);font-size:12px;margin-left:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px;font-size:13px;max-width:100%}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{width:34px;height:36px;border:0;background:var(--grey);cursor:pointer;font-size:16px}
.qty button:hover{background:var(--lav)}
.qty output{min-width:34px;display:grid;place-items:center;font-size:14px}
.add{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:0 16px;height:36px;cursor:pointer;font-weight:700}.add:hover{background:var(--ink2)}
.tip{font-size:11px;color:var(--mut);margin-top:4px}
.ok{background:var(--yel);color:#222;border-radius:14px;padding:10px 12px;font-size:14px;align-self:stretch}
.cart{background:var(--grey);border-radius:14px;padding:12px;font-size:13px}
.cart table{width:100%;border-collapse:collapse;margin:6px 0}.cart td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}.cart td:last-child{text-align:right;white-space:nowrap}
.cart .rm{background:none;border:0;cursor:pointer;color:var(--mut);font-size:12px;text-decoration:underline;padding:0 0 0 6px}
.cart .go{margin-top:8px;width:100%}
.ft{display:flex;gap:8px;padding:10px 12px 6px;border-top:1px solid var(--line);background:var(--bg)}
.ft input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:11px 14px;background:var(--bg);min-width:0;font-size:14px}
.ft input:focus{border-color:var(--ink);outline:none}
.ft button{width:44px;border-radius:50%;border:0;background:var(--ink);color:#fff;cursor:pointer;font-size:16px}
.fn{font-size:10.5px;color:var(--mut);text-align:center;padding:0 12px 8px;background:var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

/* Shopify CDN URLs seen on thetattyyak.com (used only when remoteImages=true; auto-falls back to IMG on error) */
const CDN={brew:'https://thetattyyak.com/cdn/shop/files/brew_bar_beef.png?v=1784975511&width=400',strw:'https://thetattyyak.com/cdn/shop/files/TwistedStrawberry-2.png?v=1778650469&width=400',puff:'https://thetattyyak.com/cdn/shop/files/original_puff_pouch_1.png?v=1778662798&width=400',top:'https://thetattyyak.com/cdn/shop/files/Topper.jpg?v=1782237526&width=400',hero:'https://thetattyyak.com/cdn/shop/files/Hero_Banner.jpg?v=1778676351&width=900'};

/* ===== State ===== */
const PAGE=2,STEP_OF={w:1,s:2,p:3};
const S={open:false,step:0,a:{},offset:0,sort:null,qty:{},vsel:{},cart:[],trade:CFG.customer==='trade',msgs:[],typing:false,gen:0,wantFocus:false,fb:0,anchor:null,used:-1,welcomed:false};
let Q=Promise.resolve();
const $=s=>document.querySelector(s),log=$('#log');
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbp=n=>'£'+n.toFixed(2);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const minQ=()=>S.trade?CFG.tradeMin:1;
const price=v=>S.trade?+(v.p*(1-CFG.tradeDiscount)).toFixed(2):v.p;
const prod=id=>CATALOGUE.find(p=>p.id===id);
const imgTag=(id,alt,cls)=>`<img${cls?` class="${cls}"`:''} src="${(CFG.remoteImages&&CDN[id])||IMG[id]}" alt="${esc(alt)}" data-fb="${id}" decoding="async">`;

/* ===== Matching (transparent, rule-based) ===== */
function results(sort){
  const {w,s,p}=S.a;
  const all=CATALOGUE.map(c=>{
    const vi=c.variants.findIndex(v=>v.fits.includes(w)); if(vi<0)return null;
    let score=1;const why=[`${c.variants[vi].l} size is marked suitable for dogs ${WEIGHTS[w].label.toLowerCase()}`];
    if(c.styles.includes(s)){score+=2;why.push(`Tagged as suitable for ${STYLES.find(x=>x.id===s).label.toLowerCase()}s`)}
    else why.push(`Not specifically tagged for ${STYLES.find(x=>x.id===s).label.toLowerCase()}s`);
    if(p!=='any'&&c.cat===p){score+=3;why.push(`Matches your choice: ${PREFS.find(x=>x.id===p).label.toLowerCase()}`)}
    return {c,score,why,vi};
  }).filter(Boolean);
  let list=p==='any'?all:all.filter(r=>r.c.cat===p);
  const relaxed=!list.length;if(relaxed)list=all;
  list.sort(sort==='price'?(a,b)=>price(a.c.variants[a.vi])-price(b.c.variants[b.vi]):(a,b)=>b.score-a.score);
  list.relaxed=relaxed;return list;
}

/* ===== Message queue with typing indicator ===== */
function push(m){S.msgs.push(m);if(m.t==='cards')S.anchor=S.msgs.length-1;else if(m.t==='user'||m.t==='ok'||m.t==='cart')S.anchor=null;
  if(m.t==='bot'||m.t==='ok')$('#sr').textContent=m.t==='ok'?'Added to cart':m.html.replace(/<[^>]+>/g,' ');
  render()}
function say(m,typing=true){const g=S.gen;Q=Q.then(async()=>{if(g!==S.gen)return;
  if(typing){S.typing=true;render();await sleep(CFG.typingMs);if(g!==S.gen)return;S.typing=false}
  push(m)})}
const bot=(html,typing)=>say({t:'bot',html},typing);
function userSay(text,ans){const g=S.gen;Q=Q.then(()=>{if(g!==S.gen)return;push({t:'user',text,ans:ans||[]})})}
function reset(){S.gen++;Q=Promise.resolve();S.typing=false;S.used=-1;S.anchor=null}
function lastOptsIdx(){for(let i=S.msgs.length-1;i>=0;i--)if(S.msgs[i].t==='opts')return i;return -1}
function lockOpts(){S.used=lastOptsIdx()}

/* ===== Conversation flow ===== */
function welcome(){
  say({t:'banner'},false);
  bot(`Hi there! 👋 I'm the Tatty Yak Chew Selector, a rule-based assistant (no live AI). I'll ask a few quick questions about your dog and suggest suitable natural chews.<ul class="ticks"><li>Find the right size and type</li><li>Based on your dog's needs</li><li>Add to cart directly from here</li></ul>`);
  say({t:'opts',kind:'start'},false);
}
function ask(step){
  if(step===0){bot('Ready when you are!');say({t:'opts',kind:'start'},false)}
  else if(step===1){bot('How much does your dog weigh? Pick an option, or type it (for example <b>12 kg</b>).');say({t:'opts',kind:'weight'},false)}
  else if(step===2){bot('How would you describe your dog\'s chewing style?');say({t:'opts',kind:'style'},false)}
  else if(step===3){bot('Any specific preferences?');say({t:'opts',kind:'pref'},false)}
  else say({t:'opts',kind:'next'},false);
}
function showResults(note){
  S.offset=0;
  const list=results(S.sort);
  if(!list.length){bot('I couldn\'t find a match in the product data for those answers. You can start again, or email <b>hello@thetattyyak.com</b> for help.');say({t:'opts',kind:'next'},false);return}
  const a=S.a;
  bot((note?note+' ':'')+`Based on what you've told me (${WEIGHTS[a.w].label.toLowerCase()}, ${STYLES.find(x=>x.id===a.s).label.toLowerCase()}), here ${list.length>1?'are the best matches':'is the best match'}${list.relaxed?' (nothing in your chosen type is marked suitable, so these are other options)':''}. Always supervise your dog while chewing. <span class="tip">Prototype: suitability tags are placeholders until approved.</span>`);
  say({t:'cards',offset:0,sort:S.sort},false);
  bot('Need anything else?',true);say({t:'opts',kind:'next'},false);
}
function more(){
  const n=results(S.sort).length;
  if(n<=PAGE){bot('Those are all the matches I have for your answers. You can change your answers or start again.');say({t:'opts',kind:'next'},false);return}
  S.offset=S.offset+PAGE>=n?0:S.offset+PAGE;
  bot(S.offset===0?'That\'s everything, so here\'s the first set again.':'Here are some more options.');
  say({t:'cards',offset:S.offset,sort:S.sort},false);say({t:'opts',kind:'next'},false);
}
/* Fill slots (from buttons or typed text), then advance to the next unanswered question */
function fill(slots,shown,typed,ackBits){
  lockOpts();S.fb=0;if(Object.keys(slots).length)S.sort=null;
  const ans=[];if(S.step===0)ans.push(0);
  for(const k of ['w','s','p'])if(slots[k]!==undefined){if(STEP_OF[k]>=Math.max(S.step,1)||S.step===0)ans.push(STEP_OF[k]);S.a[k]=slots[k]}
  const wasResults=S.step===4;
  if(S.step===0)S.step=1;
  while(S.step<4&&S.a[['','w','s','p'][S.step]]!==undefined)S.step++;
  userSay(shown,ans);
  if(typed&&ackBits.length&&!wasResults)bot('Got it: '+ackBits.join(', ')+'.');
  if(S.step===4)showResults(wasResults&&ackBits.length?'Updated: '+ackBits.join(', ')+'.':'');else ask(S.step);
}
function lastDefining(){for(let i=S.msgs.length-1;i>=0;i--){const m=S.msgs[i];if(m.t==='user'&&m.ans&&m.ans.length)return i}return -1}
function rewind(step){
  let idx=S.msgs.findIndex(m=>m.t==='user'&&m.ans&&m.ans.includes(step));
  reset();
  if(idx<0){['w','s','p'].forEach(k=>{if(STEP_OF[k]>=step)delete S.a[k]});S.step=step;S.offset=0;S.sort=null;ask(step);render();return}
  const first=Math.min(...S.msgs[idx].ans);
  S.msgs.length=idx;['w','s','p'].forEach(k=>{if(STEP_OF[k]>=first)delete S.a[k]});
  S.step=first;S.offset=0;S.sort=null;render();
}
function canBack(){return lastDefining()>=0}
function back(){const i=lastDefining();if(i<0)return;rewind(Math.min(...S.msgs[i].ans))}
function restart(){S.welcomed=true;reset();S.msgs.length=0;S.a={};S.step=0;S.offset=0;S.sort=null;S.qty={};S.vsel={};render();welcome()}

/* ===== Cart ===== */
function addToCart(pid){
  const m=results(S.sort).find(r=>r.c.id===pid);const c=prod(pid);
  const vi=S.vsel[pid]??(m?m.vi:0),q=Math.max(S.qty[pid]||minQ(),minQ());
  const ex=S.cart.find(l=>l.id===pid&&l.vi===vi);ex?ex.qty+=q:S.cart.push({id:pid,vi,qty:q});
  say({t:'ok',id:pid,vi,qty:q},false);bot('Need anything else?',true);say({t:'opts',kind:'next'},false);
}
function viewCart(){say({t:'cart'},true);say({t:'opts',kind:'next'},false)}

/* ===== Text understanding ===== */
function weightFrom(t){
  let best=null;
  for(const m of t.matchAll(/(\d+(?:[.,]\d+)?)\s*(kgs?|kilos?|kilograms?|lbs?|pounds?|stone|st)\b/g)){
    let n=parseFloat(m[1].replace(',','.')),u=m[2];
    n=/^(lb|pound)/.test(u)?n*0.45359:/^st/.test(u)?n*6.35029:n;best={kg:n,raw:m[0]};break}
  if(!best&&S.step<=1&&/^\s*\d+(?:[.,]\d+)?\s*$/.test(t))best={kg:parseFloat(t.replace(',','.')),raw:t.trim()+' kg',assumed:true};
  if(!best)return null;
  if(!(best.kg>0&&best.kg<=120))best.bad=true;return best;
}
const bucket=kg=>kg<5?0:kg<=10?1:kg<=20?2:kg<=30?3:4;
function parse(text){
  const t=text.toLowerCase(),r={slots:{},bits:[]};
  const wk=weightFrom(t);
  if(wk){if(wk.bad)r.badWeight=true;else{r.slots.w=bucket(wk.kg);r.bits.push(`<b>${esc(wk.raw.trim())}</b> (${WEIGHTS[r.slots.w].label})`)}}
  const st=[];
  if(/\b(gentle|soft|slow|nibbl\w*|delicate|mild)\b/.test(t))st.push('gentle');
  if(/\b(moderate|average|normal|in[- ]between|medium chewer)\b/.test(t))st.push('moderate');
  if(/\b(power|strong|aggressive|destroy\w*|heavy chewer|extreme|determined)\b/.test(t))st.push('power');
  if(st.length===1){r.slots.s=st[0];r.bits.push(STYLES.find(x=>x.id===st[0]).label.toLowerCase())}else if(st.length>1)r.ambStyle=true;
  const pf=[];
  if(/\b(bars?|yak chews?|twist\w*|brew|bone broth)\b/.test(t))pf.push('bars');
  if(/\b(puff\w*|crunchy)\b/.test(t))pf.push('puffed');
  if(/\b(toppers?|sprinkle\w*|powder\w*|food topper)\b/.test(t))pf.push('topper');
  if(!pf.length&&S.step===3&&t.split(/\s+/).length<=6&&/(not sure|no preference|don'?t mind|anything|\bany\b|surprise|whatever)/.test(t))pf.push('any');
  if(pf.length===1){r.slots.p=pf[0];r.bits.push('preference: '+PREFS.find(x=>x.id===pf[0]).label.toLowerCase())}
  return r;
}
const FAQ=[
 [/\b(trade|wholesale|b2b|stockist|reseller|bulk)\b/,()=>`Eligible trade customers see wholesale pricing, with a minimum of <b>${CFG.tradeMin}</b> per item. Trade accounts are set up through the <b>Wholesale Register</b> page on the website. (In this prototype, use the Retail / Trade switch to preview both views.)`],
 [/\b(shipping|delivery|deliver|postage|post|courier|dispatch)\b/,()=>'The website currently shows free express shipping above £600. For delivery times and other shipping questions, please email <b>hello@thetattyyak.com</b>.'],
 [/\b(price|prices|cost|how much|expensive|cheap|discount)\b/,()=>S.step>=4?'Prices are shown on each product card. Say <b>cheapest</b> and I\'ll list the lowest-priced matches first.':'Prices are shown with each recommendation. Answer a few questions about your dog and I\'ll show matching products with their prices.'],
 [/\b(ingredient\w*|made (of|from)|natural|yak milk|preservative\w*|chemical\w*)\b/,()=>'The website describes the chews as natural, made from yak milk, with no added chemicals or preservatives. For full ingredient and allergen details, please check each product page or email <b>hello@thetattyyak.com</b>.'],
 [/\b(vet|safe|safety|puppy|puppies|senior|teeth|dental|allerg\w*|choke|choking|sick|health|medical|diet)\b/,()=>'I can\'t give health or safety advice. Please check the product page and speak to your vet, especially for puppies, seniors or dogs with allergies or dental concerns.'],
 [/\b(contact|email|phone|human|person|agent|support|help desk|speak to)\b/,()=>'You can email the team at <b>hello@thetattyyak.com</b>. This chat is an automated, rule-based assistant, and no live agent is connected in this prototype.'],
 [/\b(are you|r u)\b.*\b(ai|bot|robot|human|real|chatgpt)\b|\bwho are you\b|\bwhat are you\b/,()=>'I\'m an automated, rule-based assistant. No live AI service or human is connected in this prototype. I match your answers against product suitability rules.'],
 [/\b(why|how did you|explain|how do you)\b/,()=>'I match three things: your dog\'s <b>weight</b> (against each size variant), <b>chewing style</b> (against each product\'s suitability tags) and your <b>preference</b>. Each card lists the rules that matched. In this prototype the suitability tags are placeholders until approved.']
];
const hello=/^(hi+|hello+|hey+|hiya|howdy|hola|yo|good (morning|afternoon|evening)|greetings)\b/;
function handleText(raw){
  const text=raw.trim().slice(0,200);if(!text)return;const t=text.toLowerCase().replace(/[!?.]+$/,'').trim();
  if(/^(restart|start again|start over|reset|new search)$/.test(t))return restart();
  if(/^(back|go back|undo|previous)$/.test(t)){if(canBack())return back();userSay(text);bot('We\'re already at the start.');return ask(S.step)}
  const p=parse(text);
  if(Object.keys(p.slots).length)return fill(p.slots,text,true,p.bits);
  if(S.step===0&&/^(yes|yeah|yep|yup|ok|okay|sure|please|let'?s go|go|start|find|ready)$/.test(t))return fill({},text,true,[]);
  userSay(text);
  if(p.badWeight){bot('That weight doesn\'t look right. Please enter your dog\'s weight in kg, for example <b>12 kg</b>, or pick an option.');return ask(S.step===0?1:S.step)}
  if(p.ambStyle){bot('I couldn\'t tell which chewing style fits. Please pick one:');return ask(2)}
  S.fb=0;
  if(hello.test(t)&&t.split(/\s+/).length<=4){
    if(S.step===0){bot('Hi there! 👋 Tell me a little about your dog and I\'ll suggest suitable chews. Shall we start?');return say({t:'opts',kind:'start'},false)}
    bot('Hi again! 👋 Let\'s pick up where we left off.');return ask(S.step)}
  if(/^(thanks|thank you|thx|cheers|ta|great|perfect|lovely)\b/.test(t))return bot('You\'re welcome! 🐾 Anything else I can help with?');
  if(/^(bye|goodbye|see ya|cya|that'?s all|no thanks|nope|no)$/.test(t))return bot('No problem! If you need anything else, I\'m here. 🐾');
  if(/^(yes|yeah|yep|yup|ok|okay|sure|please|let'?s go|go|start|find|ready)$/.test(t)){
    if(S.step===4)return(bot('Great! You can view your cart, see more options, or start again.'),say({t:'opts',kind:'next'},false));
    return ask(S.step)}
  if(/^(help|\?|what can you do|options|menu)$/.test(t)||/what can you (do|help)/.test(t)){bot('I can recommend chews that suit your dog\'s weight, chewing style and your preferences, then add them to your cart. I\'m rule-based, so I understand things like <b>12 kg</b>, <b>power chewer</b> or <b>toppers</b>. You can also say <b>back</b>, <b>start again</b>, <b>cart</b> or <b>more</b>.');return ask(S.step)}
  if(/\b(cart|basket)\b/.test(t)&&!/\badd\b/.test(t))return viewCart();
  if(/\bcheck ?out\b|\bpay\b/.test(t))return bot('Checkout isn\'t connected in this prototype. In the live build, this would hand your cart to Shopify checkout.');
  if(/\b(change|edit|wrong|redo|update)\b/.test(t)){
    if(/\b(weight|size|kg|heavy)\b/.test(t))return rewind(1);
    if(/\b(style|chew(ing|er)?)\b/.test(t))return rewind(2);
    if(/\b(pref\w*|type|kind)\b/.test(t))return rewind(3);
    if(S.step===4)return(bot('What would you like to change: the <b>weight</b>, <b>chewing style</b> or <b>preference</b>? Or say <b>start again</b>.'))}
  if(S.step===4){
    if(/\b(more|other|another|else|alternatives?|different)\b/.test(t))return more();
    if(/\b(cheap\w*|budget|lowest|least expensive)\b/.test(t)){S.sort='price';bot('Here are the lowest-priced matches first.');return showResults('')}
    if(/\b(add|buy|order|purchase)\b/.test(t))return bot('Use <b>Add to cart</b> on a product card above. Pick the size and quantity first.')}
  for(const [re,fn] of FAQ)if(re.test(t)){bot(fn());if(S.step<4)ask(S.step);return}
  S.fb++;
  if(S.fb>=3){bot('I\'m still not sure what you mean. You can email <b>hello@thetattyyak.com</b>, or use the buttons to continue.');}
  else bot(S.step===0?'I\'m not sure I understood that. I can help you choose a chew for your dog. Tap the button or type <b>start</b>.':S.step===1?'Sorry, I didn\'t catch that. Please pick your dog\'s weight below, or type it, for example <b>12 kg</b>.':S.step===2?'Sorry, I didn\'t catch that. Is your dog a <b>gentle</b>, <b>moderate</b> or <b>power</b> chewer?':S.step===3?'Sorry, I didn\'t catch that. Do you prefer <b>bars</b>, <b>puffed</b> chews, a <b>topper</b>, or <b>not sure</b>?':'Sorry, I didn\'t catch that. You can say <b>more</b>, <b>cheapest</b>, <b>cart</b> or <b>start again</b>.');
  ask(S.step===0?0:S.step);
}

/* ===== Rendering ===== */
const OPTS={
 start:{label:'Start',list:[{act:'start',v:'',h:"Let's find a chew!",c:' pri'}]},
 weight:{label:'Dog weight',list:WEIGHTS.map(w=>({act:'w',v:w.id,h:w.label}))},
 style:{label:'Chewing style',list:STYLES.map(s=>({act:'s',v:s.id,h:`<span class="e" aria-hidden="true">${s.e}</span><span>${s.label}<small>${s.sub}</small></span>`}))},
 pref:{label:'Preferences',list:PREFS.map(p=>({act:'p',v:p.id,h:`<span class="e" aria-hidden="true">${p.e}</span><span>${p.label}<small>${p.sub}</small></span>`}))},
 next:{label:'Next steps',list:[{act:'cart',v:'',h:'View cart',c:' pri'},{act:'more',v:'',h:'Show me more options',c:' cta'},{act:'topper',v:'',h:'Recommend a food topper',c:' cta'},{act:'restart',v:'',h:'Start again',c:' cta'}]}
};
function cardHTML(r,i,k,m){
  const c=r.c,vi=S.vsel[c.id]??r.vi,v=c.variants[vi],q=Math.max(S.qty[c.id]||minQ(),minQ()),fits=v.fits.includes(S.a.w);
  return `<div class="card"><div class="art">${imgTag(c.id,c.name)}</div><div style="flex:1;min-width:0">
   ${k===0&&m.offset===0&&m.sort!=='price'?'<span class="best">Best match</span>':''}
   <div class="cat">${PREFS.find(x=>x.id===c.cat).label}</div><h4>${c.name}</h4>
   <div class="pr">${gbp(price(v))}${S.trade?`<s>${gbp(v.p)} retail</s>`:''}</div>
   <ul class="why">${r.why.map(w=>`<li>${w}</li>`).join('')}</ul>
   ${fits?'':'<div class="tip">⚠ This option isn\'t marked suitable for your dog\'s weight.</div>'}
   <div class="row"><label class="sr" for="v-${i}-${c.id}">Option for ${esc(c.name)}</label>
    <select id="v-${i}-${c.id}" data-act="var" data-v="${c.id}">${c.variants.map((x,j)=>`<option value="${j}"${j===vi?' selected':''}>${x.l} – ${gbp(price(x))}</option>`).join('')}</select></div>
   <div class="row"><div class="qty" role="group" aria-label="Quantity for ${esc(c.name)}"><button id="qm-${i}-${c.id}" data-act="qm" data-v="${c.id}" aria-label="Decrease quantity">−</button><output aria-live="polite">${q}</output><button id="qp-${i}-${c.id}" data-act="qp" data-v="${c.id}" aria-label="Increase quantity">+</button></div>
    <button class="add" id="add-${i}-${c.id}" data-act="add" data-v="${c.id}">Add to cart</button></div>
   ${S.trade?`<div class="tip">Trade minimum: ${CFG.tradeMin} per item.</div>`:''}
  </div></div>`;
}
function cartHTML(){
  if(!S.cart.length)return `<div class="m b">Your cart is empty. Add a product from the recommendations to see it here.</div>`;
  let t=0;
  const rows=S.cart.map((l,j)=>{const c=prod(l.id),v=c.variants[l.vi],pp=price(v)*l.qty;t+=pp;return `<tr><td>${l.qty} × ${c.name} (${v.l})<button class="rm" data-act="rm" data-v="${j}" aria-label="Remove ${esc(c.name)} from cart">Remove</button></td><td>${gbp(pp)}</td></tr>`}).join('');
  return `<div class="cart"><b>Your cart</b><table>${rows}<tr><td><b>Subtotal</b></td><td><b>${gbp(t)}</b></td></tr></table>${S.trade?'<div class="tip">Trade view: wholesale prices (placeholder discount).</div>':''}<div class="tip">Prototype cart: no live Shopify cart is connected.</div><button class="opt pri go" data-act="checkout">Checkout (not connected)</button></div>`;
}
function msgHTML(m,i,lastOpts){
  switch(m.t){
   case 'bot':return `<div class="m b">${m.html}</div>`;
   case 'user':return `<div class="m u">${esc(m.text)}</div>`;
   case 'banner':return imgTag('hero','Tatty Yak chews','wi');
   case 'opts':{const o=OPTS[m.kind],on=i===lastOpts&&S.used!==i;return `<div class="opts" role="group" aria-label="${o.label}">${o.list.map(x=>`<button id="o-${i}-${x.act}${x.v}" class="opt${x.c||''}" data-act="${x.act}" data-v="${x.v}"${on?'':' disabled'}>${x.h}</button>`).join('')}</div>`}
   case 'cards':{if(S.a.w===undefined||S.a.s===undefined||S.a.p===undefined)return '<div class="cards"></div>';
     const list=results(m.sort).slice(m.offset,m.offset+PAGE);return `<div class="cards">${list.map((r,k)=>cardHTML(r,i,k,m)).join('')}</div>`}
   case 'ok':{const c=prod(m.id);return `<div class="ok" role="status">✅ <b>Added to cart!</b> 🎉 ${m.qty} × ${c.name} (${c.variants[m.vi].l}) has been added to your cart. <em>(prototype cart)</em></div>`}
   case 'cart':return cartHTML();
  }return '';
}
let cache=[];
function render(keep){
  const ae=document.activeElement,fid=ae&&log.contains(ae)?ae.id:null,st=log.scrollTop;
  let lastOpts=-1;S.msgs.forEach((m,i)=>{if(m.t==='opts')lastOpts=i});
  const hs=S.msgs.map((m,i)=>msgHTML(m,i,lastOpts));
  if(S.typing)hs.push('<div class="m b typ" aria-hidden="true"><i></i><i></i><i></i></div>');
  hs.forEach((h,i)=>{
    if(!log.children[i])log.insertAdjacentHTML('beforeend',h);
    else if(cache[i]!==h)log.children[i].outerHTML=h;
  });
  while(log.children.length>hs.length)log.lastElementChild.remove();
  cache=hs;
  const idx=Math.min(S.step,4),n=Math.max(1,idx);
  $('#prog').innerHTML=`<span>Step ${n} of 4</span>`+[1,2,3,4].map(k=>`<i class="${S.step>=k?'on':''}"></i>`).join('');
  $('#back').disabled=!canBack();
  if(keep)log.scrollTop=st;
  else if(S.anchor!=null&&log.children[S.anchor])log.scrollTop=log.children[S.anchor].offsetTop-log.offsetTop-8;
  else log.scrollTop=log.scrollHeight;
  let done=false;
  if(fid){const el=document.getElementById(fid);if(el&&!el.disabled){el.focus({preventScroll:true});done=true}}
  if(!done&&S.wantFocus&&!S.typing&&S.msgs.length&&S.msgs[S.msgs.length-1].t==='opts'){const b=log.lastElementChild.querySelector('button:not(:disabled)');if(b){b.focus({preventScroll:true});S.wantFocus=false}}
}

/* ===== Events ===== */
const act={
  start:()=>fill({},"Let's find a chew!",false,[]),
  w:v=>fill({w:+v},WEIGHTS[+v].label,false,[]),
  s:v=>fill({s:v},STYLES.find(x=>x.id===v).label,false,[]),
  p:v=>fill({p:v},PREFS.find(x=>x.id===v).label,false,[]),
  more:()=>{lockOpts();userSay('Show me more options');more()},
  topper:()=>{lockOpts();S.a.p='topper';S.sort=null;userSay('Recommend a food topper');showResults('')},
  cart:()=>{lockOpts();userSay('View cart');viewCart()},
  restart:()=>restart(),
  add:v=>addToCart(v),
  qm:v=>{S.qty[v]=Math.max(minQ(),(S.qty[v]||minQ())-1);render(true)},
  qp:v=>{S.qty[v]=Math.min(99,(S.qty[v]||minQ())+1);render(true)},
  rm:v=>{S.cart.splice(+v,1);render(true)},
  checkout:()=>bot('Checkout isn\'t connected in this prototype. In the live build, this would hand your cart to Shopify checkout.')
};
log.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;
  S.wantFocus=['start','w','s','p','more','topper','cart','add'].includes(b.dataset.act);act[b.dataset.act](b.dataset.v)});
log.addEventListener('change',e=>{if(e.target.dataset.act==='var'){S.vsel[e.target.dataset.v]=+e.target.value;render(true)}});
log.addEventListener('error',e=>{const t=e.target;if(t.tagName!=='IMG')return;
  if(!t.dataset.tried&&IMG[t.dataset.fb]&&t.src!==IMG[t.dataset.fb]){t.dataset.tried=1;t.src=IMG[t.dataset.fb]}else t.style.visibility='hidden'},true);
$('#form').addEventListener('submit',e=>{e.preventDefault();const i=$('#txt');const v=i.value;i.value='';if(v.trim()){S.wantFocus=false;handleText(v)}i.focus()});
$('#back').onclick=back;$('#restart').onclick=restart;
function openChat(o){S.open=o;$('#w').hidden=!o;$('#launch').hidden=o;$('#launch').setAttribute('aria-expanded',o);
  if(o){if(!S.welcomed){S.welcomed=true;welcome()}render();setTimeout(()=>$('#txt').focus(),30)}else $('#launch').focus()}
$('#launch').onclick=()=>openChat(true);$('#close').onclick=()=>openChat(false);
$('#w').addEventListener('keydown',e=>{if(e.key==='Escape')openChat(false)});
function setView(v){$('#stage').dataset.view=v;$('#vD').setAttribute('aria-pressed',v==='desktop');$('#vM').setAttribute('aria-pressed',v==='mobile')}
$('#vD').onclick=()=>setView('desktop');$('#vM').onclick=()=>setView('mobile');
function setCustomer(tr){
  const same=S.trade===tr;S.trade=tr;$('#cR').setAttribute('aria-pressed',!tr);$('#cT').setAttribute('aria-pressed',tr);if(same)return;
  let raised=false;S.cart.forEach(l=>{if(l.qty<minQ()){l.qty=minQ();raised=true}});S.qty={};
  render(true);
  if(S.msgs.length)bot(tr?`Switched to the trade view: wholesale prices apply and the minimum quantity is ${CFG.tradeMin}.${raised?' Cart quantities were raised to the minimum.':''} (Trade eligibility is mocked in this prototype.)`:'Switched to the retail view.',false);
}
$('#cR').onclick=()=>setCustomer(false);$('#cT').onclick=()=>setCustomer(true);
$('#cR').setAttribute('aria-pressed',!S.trade);$('#cT').setAttribute('aria-pressed',S.trade);
if(!CFG.prototypeNote)$('#fn').hidden=true;
if(CFG.autoOpen)openChat(true);
})();
</script>
</body>
