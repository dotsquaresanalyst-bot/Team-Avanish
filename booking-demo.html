function endTour(){T=null;$('#tour').hidden=true;$('#tour').innerHTML='';const f=document.contains(TF)&&TF.offsetParent?TF:$('#btn-help');f.focus()}
function tourStep(){const L=TOURS[T.id],N=L.steps.length,fin=T.i>=N,s=L.steps[T.i];if(!fin&&s.go)s.go();
$('#tour').hidden=false;$('#tour').innerHTML=`<div class="tshield"></div><div class="spot"></div><div class="tip" role="dialog" aria-modal="true" aria-label="Guided tour: ${L.name}" tabindex="-1"><div class="tprog"><i style="width:${Math.round((fin?N:T.i+1)/N*100)}%"></i></div>${fin?`<h3>🎉 Tour complete</h3><p>${L.name} finished. No bookings were created or changed by this tour. Replay anytime from Help / Replay Tours.</p>`:`<small>${L.name} · Step ${T.i+1} of ${N}</small><h3>${s.t}</h3><p>${s.x}</p><p class="tnote" hidden></p>`}<div class="tbtns"><button class="btn sec" data-tn="back" ${T.i?'':'disabled'}>Back</button>${fin?'':`<button class="btn pri" data-tn="next">${T.i==N-1?'Finish':'Next'}</button>`}<button class="btn sec" data-tn="restart">Restart Tour</button><button class="btn sec" data-tn="skip">Skip Tour</button><button class="btn sec" data-tn="close">Close</button></div></div>`;
setTimeout(()=>{place();const t=$('.tip');if(t)t.focus()},90)}
function tourNav(a){const N=TOURS[T.id].steps.length;if(a==='next'){T.i++;if(T.i>=N){const d=TKS();d.done[T.id]=1;try{localStorage.setItem(TK,JSON.stringify(d))}catch{}}tourStep()}else if(a==='back'){if(T.i>0){T.i--;tourStep()}}else if(a==='restart'){T.i=0;tourStep()}else if(a==='skip'){endTour();toast('Tour skipped — no data was changed.')}else endTour()}
function place(){if(!T||$('#tour').hidden)return;const s=TOURS[T.id].steps[T.i],tip=$('.tip'),sp=$('.spot');if(!tip)return;const vw=innerWidth,vh=innerHeight;let el=s&&$(s.sel);if(el&&!(el.offsetWidth||el.offsetHeight))el=null;
if(!el){sp.style.display='none';$('.tshield').classList.add('dim');if(s){const n=$('.tnote',tip);n.hidden=false;n.textContent='This control isn’t visible right now (for example, no request is in that state yet). Click Next to continue, or use Load Sample Requests after the tour.'}tip.style.left=Math.max(12,(vw-tip.offsetWidth)/2)+'px';tip.style.top=Math.max(12,(vh-tip.offsetHeight)/3)+'px';return}
sp.style.display='block';$('.tshield').classList.remove('dim');let r=el.getBoundingClientRect();const tall=r.height>vh*.5;if(r.top<60||r.bottom>vh-20||tall){el.scrollIntoView({block:tall?'start':'center'});r=el.getBoundingClientRect()}
Object.assign(sp.style,{left:r.left-6+'px',top:r.top-6+'px',width:r.width+12+'px',height:r.height+12+'px'});
const tw=tip.offsetWidth,th=tip.offsetHeight;let top=tall?vh-th-12:vh-r.bottom>=th+16?r.bottom+14:r.top>=th+16?r.top-th-14:vh-th-12;
tip.style.top=Math.max(8,top)+'px';tip.style.left=Math.max(12,Math.min(r.left+r.width/2-tw/2,vw-tw-12))+'px'}
addEventListener('resize',place);addEventListener('scroll',place,true);
const trap=(root,e)=>{const f=$$('button:not(:disabled),input,select,textarea,a[href]',root);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}else if(!root.contains(document.activeElement)){e.preventDefault();a.focus()}};
document.addEventListener('keydown',e=>{if(T){if(e.key==='Escape')endTour();else if(e.key==='ArrowRight'&&T.i<TOURS[T.id].steps.length)tourNav('next');else if(e.key==='ArrowLeft')tourNav('back');else if(e.key==='Tab')trap($('.tip'),e);return}
if(M){if(e.key==='Escape')closeModal();else if(e.key==='Tab')trap($('.mb',M),e)}});
document.addEventListener('click',e=>{const tn=e.target.closest('[data-tn]');if(tn&&T)return tourNav(tn.dataset.tn);const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act])ACT[el.dataset.act](el,e)});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(k&&G.draft){G.draft[k]=k==='guests'?(+t.value||0):t.value;const er=$('#e-'+k);if(er)er.textContent='';t.removeAttribute('aria-invalid');updT()}
if(t.id==='f-gin'){G.f.guests=Math.max(1,Math.min(99,parseInt(t.value)||1));drawBoats()}if(t.id==='a-search'){A.q=t.value;board()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='f-date'){if(t.value&&t.value<day(0)){t.value=day(0);toast('Past dates aren’t available.')}G.f.date=t.value;drawBoats()}
if(t.dataset.k==='boat'&&G.draft){const bt=B(t.value);if(!bt.p[G.draft.trip])G.draft.trip=Object.keys(bt.p)[0];render();$('#fm-boat').focus()}
if(t.id==='c-boat'){C.cap=t.value;C.sel=null;C.done=null;render();$('#c-boat').focus()}if(t.id==='a-boat'){A.boat=t.value;board()}if(t.id==='a-date'){A.date=t.value;board()}});
addEventListener('storage',e=>{if(e.key===KEY){S=rd(KEY,{seq:1000,bookings:[]});if(!(R==='guest'&&G.page==='form')&&!T){render();if(D&&M)drawer(D)}}});
setInterval(()=>{if(autoEsc()&&!(R==='guest'&&G.page==='form')&&!T)render();$$('[data-since]').forEach(x=>x.textContent=dur(Date.now()-x.dataset.since));if(R==='admin')metrics()},3e4);
autoEsc();render();
</script>
</body>
</html>
